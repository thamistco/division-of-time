plugins { id 'com.android.application' }
android {
  namespace 'com.thamistco.divisionoftime'
  compileSdk 34
  defaultConfig {
    applicationId 'com.thamistco.divisionoftime'
    minSdk 29
    targetSdk 34
    versionCode 4
    versionName '1.3'
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('DOT_KEYSTORE') ?: 'missing.jks')
      storePassword System.getenv('DOT_KEYPASS') ?: ''
      keyAlias 'dot'
      keyPassword System.getenv('DOT_KEYPASS') ?: ''
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'robolectric.offline', 'true'; systemProperty 'robolectric.dependency.dir', '/workspace/work/robolectric' } } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.google.android.gms:play-services-auth:21.2.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.13'
  testImplementation 'androidx.test:core:1.6.1'
}
