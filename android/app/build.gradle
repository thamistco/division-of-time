plugins { id 'com.android.application' }
android {
  namespace 'com.thamistco.divisionoftime'
  compileSdk 34
  defaultConfig {
    applicationId 'com.thamistco.divisionoftime'
    minSdk 29
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('DOT_KEYSTORE') ?: 'missing.jks')
      storePassword System.getenv('DOT_KEYPASS') ?: ''
      keyAlias 'dot'
      keyPassword System.getenv('DOT_KEYPASS') ?: ''
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.android.gms:play-services-auth:21.2.0' }
